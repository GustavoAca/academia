name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Validar estrutura
      - name: Validar estrutura
        run: |
          echo "Validando estrutura do projeto..."

          REQUIRED_FILES=(
            "index.html"
            "manifest.json"
            "service-worker.js"
            "css/styles.css"
            "js/db.js"
            "js/app.js"
            "js/workout-service.js"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Arquivo faltando: $file"
              exit 1
            fi
          done

          echo "✅ Estrutura validada com sucesso"

      # 3. Verificar sintaxe JavaScript
      - name: Verificar sintaxe JavaScript
        run: |
          echo "Verificando sintaxe JavaScript..."

          for jsfile in js/*.js; do
            if [ -f "$jsfile" ]; then
              echo "Verificando $jsfile"

              if ! node --check "$jsfile"; then
                echo "❌ Erro de sintaxe em $jsfile"
                exit 1
              fi
            fi
          done

          echo "✅ Sintaxe JavaScript válida"

      # 4. Verificar configuração PWA
      - name: Verificar configuração PWA
        run: |
          echo "Verificando configuração PWA..."

          REQUIRED_MANIFEST=(
            "name"
            "short_name"
            "display"
            "start_url"
            "icons"
          )

          for field in "${REQUIRED_MANIFEST[@]}"; do
            if ! grep -q "\"$field\"" manifest.json; then
              echo "❌ Campo faltando no manifest.json: $field"
              exit 1
            fi
          done

          echo "✅ manifest.json verificado"

          if [ ! -f "service-worker.js" ]; then
            echo "❌ service-worker.js não encontrado"
            exit 1
          fi

          echo "✅ service-worker.js encontrado"

      # 5. Configurar GitHub Pages
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # 6. Criar artifact
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      # 7. Deploy
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4